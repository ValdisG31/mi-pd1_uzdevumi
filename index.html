<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mani uzdevumi</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Mani uzdevumi</h1>

        <!-- Jauna uzdevuma ievade -->
        <form id="task-form">
            <input
                type="text"
                id="task-input"
                placeholder="Jauns uzdevums..."
                aria-label="Jauns uzdevums"
                autocomplete="off"
            >
            <button type="submit" id="add-btn">Pievienot</button>
        </form>

        <!-- Uzdevumu filtrēšana -->
        <div class="filters">
            <button type="button" data-filter="all"
                class="active" aria-pressed="true">Visi</button>
            <button type="button" data-filter="active"
                aria-pressed="false">Aktīvie</button>
            <button type="button" data-filter="completed"
                aria-pressed="false">Izpildītie</button>
        </div>

        <!-- Uzdevumu saraksts -->
        <ul id="task-list"></ul>

        <!-- Atlikušo uzdevumu skaitītājs -->
        <footer>
            <span id="counter" aria-live="polite">
                Atlikuši 0 uzdevumi
            </span>
        </footer>
    </main>
</body>
</html>
